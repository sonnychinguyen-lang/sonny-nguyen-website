<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // Single-Page Apps for GitHub Pages (rafgraph's well-known trick).
    // GitHub Pages has no server-side rewrites, so a direct link to e.g.
    // /resume 404s. This turns that into a redirect back to index.html
    // with the real path packed into the query string; the matching
    // script in index.html unpacks it via history.replaceState before
    // React Router ever sees the URL.
    var pathSegmentsToKeep = 1; // keep "/sonny-nguyen-website"
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
