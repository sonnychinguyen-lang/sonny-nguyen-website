      block(GRADE_LADDER) + '<hr>' + block(ELL_LADDER) +
      '<p class="muted small">Not assessed here: oral language (rated separately in the ELL Standards) and the First Peoples oral tradition competency, which is best taught with authentic First Peoples resources.</p>' +
      '</details>';
  }

  function markBadge(sub) {
    if (sub.reviewed) return ' <span class="badge badge-ok">Reviewed</span>';
    if (sub.aiGraded) return ' <span class="badge">AI-marked — check</span>';
    return ' <span class="badge badge-muted">Not marked</span>';
  }

  function writingLevelsFor(sub) { return sub.track === "ell" ? ELL_WRITING_LEVELS : GRADE_WRITING_LEVELS; }

  function renderSubmissionRow(sub) {
    const isOpen = teacherState.openId === sub.id;
    const date = sub.submittedAt ? new Date(sub.submittedAt).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
    const t = titlesFor(SETS[sub.baseSet] || SETS.g4);
    let html = '<div class="sub-item">' +
      '<div class="sub-head" data-action="toggle-sub" data-id="' + esc(sub.id) + '">' +
        '<div><div class="sub-name">' + esc(sub.studentName) + markBadge(sub) + '</div><div class="sub-date">' + esc(rowLabel(sub)) + ' \u00b7 ' + esc(date) + '</div></div>' +
        '<div class="sub-scores">' +
          ["spelling", "grammar", "reading"].map(function (sec) { return '<div>' + esc(t[sec]) + ': ' + esc(chainLine(sub, sec)) + '</div>'; }).join("") +
        '</div>' +
      '</div>';

    if (isOpen) {
      const levels = writingLevelsFor(sub);
      const wlDraft = teacherState.writingLevelDrafts[sub.id] != null ? teacherState.writingLevelDrafts[sub.id] : sub.writingLevel;
      const aiStatus = teacherState.aiStatus[sub.id] || "";
      const shortDrafts = teacherState.shortGradeDrafts[sub.id] || {};
      const base = SETS[sub.baseSet] || SETS.g4;

      html += '<div class="sub-body">' +
        '<div class="profile">' +
          '<div class="profile-title">' + (sub.track === "ell" ? "Indicative ELL profile" : "Indicative results") + '</div>' +
          '<table class="result-table">' +
            ["spelling", "grammar", "reading"].map(function (sec) { return '<tr><td>' + esc(AREA_NAMES[sec]) + '</td><td>' + esc(areaResult(sub, sec)) + '</td></tr>'; }).join("") +
            '<tr><td>' + esc(AREA_NAMES.writing) + '</td><td>' + esc(sub.writingLevel) + '</td></tr>' +
            '<tr><td>Oral language (your observation)</td><td>' + esc(sub.oralLanguage) + '</td></tr>' +
          '</table>' +
          '<div class="muted small" style="margin-top:6px">' + (sub.track === "ell"
            ? "BC ELL Standards rate each skill separately, so an uneven profile is normal. \u201cWorking at\u201d = highest level scored 80%+."
            : gradeIndex(sub.baseSet) >= gradeIndex("g10")
              ? "Grade 10\u201312 courses report percentages and letter grades, so results are shown as percentages."
              : "Proficiency scale used in BC K\u20139 reporting. Extending requires 90%+ plus 80%+ on the next level\u2019s bonus.") +
          ' One short check-in \u2014 confirm with classroom evidence before reporting.</div>' +
          (sub.accommodations && sub.accommodations.readAloud && !(SETS[sub.baseSet] || {}).readAloud ? '<div class="small" style="margin-top:4px">Read-aloud support was on: reading results also reflect listening comprehension.</div>' : '') +
        '</div>' +
        (sub.aiGraded && !sub.reviewed ? '<p class="ai-banner">Written answers were marked automatically. Check the marks and feedback below, adjust anything you disagree with, then save to confirm.</p>' : '') +
        (sub.custom ? '<div class="profile"><div class="profile-title">Personalised form</div><div class="small">Built from this student\u2019s earlier results. Focus: ' + esc((sub.custom.focusAreas || []).join("; ")) + '</div>' +
          (sub.custom.verified === false ? '<div class="small err-line" style="margin-top:4px">Answer key wasn\u2019t double-checked for this form \u2014 glance over any marked-wrong answers.</div>' : '') + '</div>' : '') +
        '<div class="muted small">Focus for ' + esc(base.label) + ': ' + esc(base.focus) + '</div>';

      ["spelling", "grammar", "reading"].forEach(function (sec) {
        (sub.attempts[sec] || []).forEach(function (a, i) {
          html += '<h3 class="detail-h">' + esc(t[sec]) + ' \u2014 ' + esc(setLabel(a.set, sub)) + (i > 0 ? " (bonus)" : "") + ' <span class="muted small">' + a.score.correct + '/' + a.score.total + '</span></h3>';
          html += renderAttemptItems(sub, sec, a, i, shortDrafts);
        });
        if (sub.skipped && sub.skipped[sec]) html += '<p class="muted small">' + esc(t[sec]) + ' bonus at ' + esc(setLabel(sub.skipped[sec], sub)) + ' was offered and skipped.</p>';
      });

      html += '<h3 class="detail-h">Writing</h3>' +
        '<div class="muted small">' + esc(contentFor(sub).writing.prompt) + '</div>' +
        '<div class="writing-block">' + esc(sub.writing || "(No response)") + '</div>' +
        (sub.aiCriteria ? '<div class="small criteria">AI by aspect: ' + ["meaning", "style", "form", "conventions"].map(function (k) { return '<span><b>' + k.charAt(0).toUpperCase() + k.slice(1) + '</b> ' + esc(sub.aiCriteria[k] || "\u2014") + '</span>'; }).join("") + '</div>' : '') +
        '<div class="grade-row"><label class="small" style="font-weight:700" for="wl-' + esc(sub.id) + '">' + (sub.track === "ell" ? "ELL writing level" : "Proficiency") + '</label>' +
        '<select id="wl-' + esc(sub.id) + '" data-role="writing-level" data-id="' + esc(sub.id) + '">' +
          levels.map(function (lvl) { return '<option value="' + esc(lvl) + '"' + (lvl === wlDraft ? " selected" : "") + '>' + esc(lvl) + '</option>'; }).join("") +
        '</select></div>' +
        '<div class="grade-row"><label class="small" style="font-weight:700" for="oral-' + esc(sub.id) + '">Oral language (observed)</label>' +
        '<select id="oral-' + esc(sub.id) + '" data-role="oral" data-id="' + esc(sub.id) + '">' +
          ["Not observed"].concat(levels.slice(1)).map(function (lvl) { const cur = teacherState.oralDrafts[sub.id] != null ? teacherState.oralDrafts[sub.id] : sub.oralLanguage; return '<option value="' + esc(lvl) + '"' + (lvl === cur ? " selected" : "") + '>' + esc(lvl) + '</option>'; }).join("") +
        '</select></div>' +
        (sub.reflection ? '<h3 class="detail-h">Student self-assessment</h3><div class="writing-block">' + esc(sub.reflection) + '</div>' : '') +
        '<div class="field-inline"><button class="btn-ai btn-small" data-action="grade-ai" data-id="' + esc(sub.id) + '">Re-mark with AI</button>' +
          (aiStatus ? ' <span class="ai-note">' + esc(aiStatus) + '</span>' : '') + '</div>' +
        '<div class="field-inline"><label class="field-label" for="fb-' + esc(sub.id) + '">Feedback notes</label>' +
        '<textarea id="fb-' + esc(sub.id) + '" data-role="feedback" data-id="' + esc(sub.id) + '" placeholder="Notes for this student\u2019s next lesson...">' + esc(teacherState.feedbackDrafts[sub.id] != null ? teacherState.feedbackDrafts[sub.id] : sub.teacherFeedback) + '</textarea></div>' +
        '<div class="save-row"><button class="btn-ghost btn-small" data-action="save-feedback" data-id="' + esc(sub.id) + '">Save grading &amp; feedback</button>' +
        '<span class="save-status">' + esc(teacherState.saveStatus[sub.id] || "") + '</span>' +
        '<button class="btn-link" data-action="delete-record" data-id="' + esc(sub.id) + '">' + (teacherState.confirmDelete === sub.id ? "Tap again to permanently delete" : "Delete this check-in") + '</button></div>' +
      '</div>';
    }
    return html + '</div>';
  }

  function renderAttemptItems(sub, sec, attempt, level, shortDrafts) {
    let items = itemsFor(attempt.set, sec, level, sub);
    const answers = attempt.answers || {};
    if (Object.keys(answers).length) items = items.filter(function (q) { return Object.prototype.hasOwnProperty.call(answers, q.id); });
    return items.map(function (q) {
      if (q.type === "mc") {
        const given = answers[q.id];
        const ok = given === q.correct;
        const givenText = given != null && q.options[given] != null ? q.options[given] : "\u2014 no answer \u2014";
        return '<div class="detail-q"><div>' + esc(q.prompt.replace(/\n/g, " ")) + '</div>' +
          '<div><span class="' + (ok ? "tag-correct" : "tag-wrong") + '">' + (ok ? "Correct: " : "Answered: ") + esc(givenText) + '</span>' +
          (ok ? "" : ' <span class="muted">(correct: ' + esc(q.options[q.correct]) + ')</span>') + '</div></div>';
      }
      const saved = sub.answerGrades[q.id];
      const current = shortDrafts[q.id] != null ? shortDrafts[q.id] : (saved || "Not yet graded");
      const note = sub.aiNotes[q.id];
      return '<div class="detail-q"><div>' + esc(q.prompt) + '</div>' +
        '<div class="writing-block" style="margin:6px 0">' + esc(answers[q.id] || "(No response)") + '</div>' +
        (note ? '<div class="ai-note">AI note: ' + esc(note) + '</div>' : '') +
        '<div class="grade-row"><select data-role="short-grade" data-id="' + esc(sub.id) + '" data-qid="' + esc(q.id) + '">' +
          SHORT_GRADE_OPTIONS.map(function (o) { return '<option value="' + esc(o) + '"' + (o === current ? " selected" : "") + '>' + esc(o) + '</option>'; }).join("") +
        '</select></div></div>';
    }).join("");
  }

  async function loadTeacherData(force) {
    await capsReady;
    if (!db) { render(); return; }
    if (teacherState.loaded && !force) { render(); return; }
    teacherState.loading = true; teacherState.error = null; render();
    try {
      const snap = await db.collection("submissions").orderBy("submittedAt", "desc").limit(200).get();
      teacherState.submissions = snap.docs.map(function (d) { return normalize(d.id, d.data()); });
      teacherState.loaded = true;
    } catch (e) { teacherState.error = e; }
    teacherState.loading = false;
    render();
  }

  // ---------- events ----------
  function attach() {
    app.onclick = function (e) {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const a = el.dataset.action;
      if (a === "speak") { e.preventDefault(); return speak(el.dataset.speak || ""); }
      if (a === "start") return doStart();
      if (a === "begin-quiz") return beginQuiz();
      if (a === "use-standard") { state.custom = null; return beginQuiz(); }
      if (a === "retry-build") return buildForReturning();
      if (a === "next") return doNext();
      if (a === "back") return doBack();
      if (a === "skip-bonus") return doSkipBonus();
      if (a === "submit") return doSubmit();
      if (a === "restart") { genToken++; state = freshState(); return render(); }
      if (a === "goto-landing") { if (window.speechSynthesis) window.speechSynthesis.cancel(); state.screen = "landing"; state.notice = ""; return render(); }
      if (a === "goto-teacher") { state.screen = "teacher"; return loadTeacherData(false); }
      if (a === "refresh-teacher") return loadTeacherData(true);
      if (a === "toggle-sub") { teacherState.openId = teacherState.openId === el.dataset.id ? null : el.dataset.id; return render(); }
      if (a === "save-feedback") return doSaveFeedback(el.dataset.id);
      if (a === "grade-ai") return doGradeAI(el.dataset.id);
      if (a === "delete-record") return doDelete(el.dataset.id);
      if (a === "mark-all") return doMarkAll();
    };
    app.onchange = function (e) {
      const t = e.target;
      if (t.matches('input[type="radio"][data-section]')) {
        state.answers[t.dataset.section][+t.dataset.level][t.dataset.qid] = parseInt(t.value, 10);
        state.notice = "";
      }
      if (t.dataset.role === "grade") { state.gradeKey = t.value; state.readAloudChoice = null; render(); }
      if (t.dataset.role === "readaloud") { state.readAloudChoice = t.checked; }
      if (t.dataset.role === "oral") teacherState.oralDrafts[t.dataset.id] = t.value;
      if (t.dataset.role === "ell") { state.ellChoice = t.value; state.readAloudChoice = null; render(); }
      if (t.dataset.role === "writing-level") teacherState.writingLevelDrafts[t.dataset.id] = t.value;
      if (t.dataset.role === "short-grade") {
        const id = t.dataset.id;
        if (!teacherState.shortGradeDrafts[id]) teacherState.shortGradeDrafts[id] = {};
        teacherState.shortGradeDrafts[id][t.dataset.qid] = t.value;
      }
    };
    app.oninput = function (e) {
      const t = e.target;
      if (t.id === "studentName") state.studentName = t.value;
      if (t.id === "reflectionArea") state.reflection = t.value;
      if (t.id === "writingArea") {
        state.writing = t.value;
        const c = document.getElementById("writingCount");
        if (c) c.textContent = writingCountText();
      }
      if (t.dataset.role === "short-answer") state.answers[t.dataset.section][+t.dataset.level][t.dataset.qid] = t.value;
      if (t.dataset.role === "feedback") teacherState.feedbackDrafts[t.dataset.id] = t.value;
      if (t.dataset.role === "filter") {
        const v = t.value;
        teacherState.filter = v;
        render();
        const fi = document.getElementById("filterInput");
        if (fi) { fi.focus(); fi.setSelectionRange(v.length, v.length); }
      }
    };
  }

  function stageComplete() {
    const sec = state.stage.section, lvl = state.stage.level;
    if (sec === "writing") return state.writing.trim().length >= (SETS[baseKey()].writing.min || 5);
    const ans = state.answers[sec][lvl];
    return itemsFor(stageKey(sec, lvl), sec, lvl, quizSrc()).every(function (q) {
      const v = ans[q.id];
      if (q.type === "short") return typeof v === "string" && v.trim().length >= 2;
      return v !== undefined;
    });
  }

  function goSection(idx) {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    state.notice = "";
    state.stage = { section: SECTIONS[idx], level: 0 };
    render();
    window.scrollTo(0, 0);
  }

  // ---------- returning students: personalised forms ----------
  function nameKey(n) { return String(n || "").trim().toLowerCase().replace(/\s+/g, " "); }

  async function findPrevious(name) {
    await capsReady;
    if (!db) return [];
    const key = nameKey(name);
    const snap = await db.collection("submissions").orderBy("submittedAt", "desc").limit(300).get();
    return snap.docs.map(function (d) { return normalize(d.id, d.data()); })
      .filter(function (s) { return nameKey(s.studentName) === key; })
      .slice(0, 3);
  }

  function beginQuiz() {
    if (genCtl) { try { genCtl.abort(); } catch (e) { /* ignore */ } }
    genToken++;
    state.stage = { section: "spelling", level: 0 };
    state.answers = { spelling: [{}, {}, {}, {}, {}], grammar: [{}, {}, {}, {}, {}], reading: [{}, {}, {}, {}, {}] };
    state.done = { spelling: 0, grammar: 0, reading: 0 };
    state.skipped = { spelling: null, grammar: null, reading: null };
    state.notice = "";
    state.screen = "quiz";
    render();
    window.scrollTo(0, 0);
  }

  let starting = false;
  async function doStart() {
    if (starting) return;
    if (!state.studentName.trim()) { state.notice = "Please type the student\u2019s name first."; return render(); }
    starting = true;
    state.custom = null; state.genError = ""; state.prev = null;
    state.notice = "Checking for earlier check-ins\u2026"; render();
    let prev = [];
    try { prev = await findPrevious(state.studentName); } catch (e) { prev = []; }
    starting = false;
    if (!prev.length) return beginQuiz();
    state.prev = prev;
    // pre-fill level from last time if the teacher left the defaults alone
    return buildForReturning();
  }

  let genCtl = null, genToken = 0;
  async function buildForReturning() {
    const myToken = ++genToken;
    genCtl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    state.screen = "preparing"; state.genError = ""; state.custom = null;
    state.genPhase = "Reading last check-in and writing new questions\u2026";
    render();
    try {
      const custom = await buildCustomTest(state.prev, baseKey(), genCtl ? genCtl.signal : undefined, function (phase) {
        if (myToken !== genToken) return;
        state.genPhase = phase;
        if (state.screen === "preparing") render();
      });
      if (myToken !== genToken) return;
      state.custom = custom;
    } catch (e) {
      if (myToken !== genToken) return;
      state.custom = null;
      if (e && e.code === "cancelled") return;
      state.genError = (e && e.message === "too-few") ? "Not enough of the new questions passed the answer check."
        : (e && e.code) ? aiErrorText(e) : "Something went wrong building the new test.";
    }
    state.screen = "intro";
    render();
  }

  function renderPreparing() {
    return '<div class="card">' +
      '<h2>Welcome back, ' + esc(state.studentName.trim()) + '</h2>' +
      '<p>Building a new check-in based on last time. This usually takes about a minute.</p>' +
      '<p class="muted small" style="display:flex;align-items:center;gap:10px"><span class="spinner"></span>' + esc(state.genPhase) + '</p>' +
      '<div class="btn-row"><button class="btn-ghost" data-action="use-standard">Use the standard test instead</button></div>' +
    '</div>';
  }

  function renderIntro() {
    const last = state.prev && state.prev[0];
    const t = titlesFor(SETS[baseKey()]);
    const when = last && last.submittedAt ? new Date(last.submittedAt).toLocaleDateString(undefined, { dateStyle: "medium" }) : "";
    let html = '<div class="card"><h2>Welcome back, ' + esc(state.studentName.trim()) + '</h2>';
    if (last) {
      html += '<div class="profile"><div class="profile-title">Last check-in \u00b7 ' + esc(when) + ' \u00b7 ' + esc(rowLabel(last)) + '</div>' +
        ["spelling", "grammar", "reading"].map(function (sec) { return '<div class="small">' + esc(t[sec]) + ': ' + esc(chainLine(last, sec)) + '</div>'; }).join("") +
        '<div class="small">Writing: ' + esc(last.writingLevel) + '</div></div>';
    }
    if (state.custom) {
      html += '<p>This is a new ' + esc(SETS[baseKey()].label) + ' check-in. It focuses on:</p>' +
        '<ul class="focus-list">' + (state.custom.focusAreas || []).map(function (f) { return '<li>' + esc(f) + '</li>'; }).join("") + '</ul>' +
        '<p class="muted small">Plus a new reading passage and writing task.' + (state.custom.verified === false ? " (The answer check couldn\u2019t run this time.)" : "") + '</p>' +
        '<div class="btn-row"><button class="btn-ghost" data-action="use-standard">Standard test</button><button class="btn-primary" data-action="begin-quiz">Start</button></div>';
    } else {
      const seenStandard = (state.prev || []).some(function (p) { return !p.custom && p.baseSet === baseKey(); });
      html += '<p class="err-line">Couldn\u2019t build a new test: ' + esc(state.genError) + '</p>' +
        '<p class="muted small">You can try again, or use the standard ' + esc(SETS[baseKey()].label) + ' test.' +
        (seenStandard ? " This student has done the standard one before, so questions will repeat." : "") + '</p>' +
        '<div class="btn-row"><button class="btn-ghost" data-action="use-standard">Standard test</button><button class="btn-primary" data-action="retry-build">Try again</button></div>';
    }
    return html + '</div>';
  }

  function cleanMCList(arr, prefix, max) {
    if (!Array.isArray(arr)) return [];
    const out = [];
    arr.forEach(function (q) {
      if (!q || typeof q.prompt !== "string" || !q.prompt.trim() || !Array.isArray(q.options)) return;
      const opts = q.options.map(function (o) { return String(o == null ? "" : o).trim(); });
      if (opts.length < 3 || opts.length > 5 || opts.some(function (o) { return !o; })) return;
      if (new Set(opts).size !== opts.length) return; // exact duplicates only (capitalization questions are allowed)
      const c = Number(q.correct);
      if (!Number.isInteger(c) || c < 0 || c >= opts.length) return;
      out.push(mc(prefix + (out.length + 1), q.prompt.trim(), opts, c));
    });
    return out.slice(0, max);
  }

  function wordCount(t) { return String(t || "").trim().split(/\s+/).filter(Boolean).length; }

  async function buildCustomTest(prevList, bKey, signal, onPhase) {
    await capsReady;
    if (!sampleFn) { const err = new Error("no-sample"); err.code = "capability_disabled"; throw err; }
    const base = SETS[bKey];
    const next = SETS[nextKeyOf(bKey)] || base;
    const titles = titlesFor(base);
    const last = prevList[0];
    const lastContent = contentFor(last);
    const isEllTrack = base.band === "ell";
    const gradeText = SETS[state.gradeKey] ? SETS[state.gradeKey].label : "";

    const misses = [];
    ["spelling", "grammar", "reading"].forEach(function (sec) {
      (last.attempts[sec] || []).forEach(function (a, i) {
        itemsFor(a.set, sec, i, last).forEach(function (q) {
          if (q.type !== "mc") return;
          const g = a.answers ? a.answers[q.id] : undefined;
          if (g === q.correct) return;
          misses.push("- [" + sec + ", " + setLabel(a.set, last) + "] " + q.prompt.replace(/\n/g, " ") + " | student chose: " + (g != null && q.options[g] != null ? q.options[g] : "no answer") + " | correct: " + q.options[q.correct]);
        });
      });
    });
    const shortLines = lastContent.reading.items.filter(function (q) { return q.type === "short"; }).map(function (q) {
      return "- " + q.prompt + " | mark: " + (last.answerGrades[q.id] || "not marked") + (last.aiNotes[q.id] ? " | note: " + last.aiNotes[q.id] : "");
    });
    const avoid = prevList.map(function (p) { const c = contentFor(p); return "- passage \u201c" + c.reading.title + "\u201d; writing prompt: " + c.writing.prompt; });
    const earlierFocus = [].concat.apply([], prevList.map(function (p) { return (p.custom && p.custom.focusAreas) || []; }));
    const ex = function (sec) { return base[sec].slice(0, 2).map(function (q) { return "  " + q.prompt.replace(/\n/g, " ") + " [" + q.options.join(" / ") + "]"; }).join("\n"); };
    const wc = wordCount(base.reading.text);
    const lo = Math.max(25, Math.round(wc * 0.8)), hi = Math.round(wc * 1.25);

    const levelDesc = isEllTrack
      ? "an English Language Learner (" + gradeText + ") at BC English Language Learning Standards (2017) level " + base.label.replace("ELL ", "")
      : "a " + base.label + " student in British Columbia, following the BC English Language Arts curriculum";

    const prompt =
      "You are writing a short English check-in for " + levelDesc + ". Use Canadian spelling. All content must be original: no quotations from published works.\n\n" +
      "THIS LEVEL'S FOCUS: " + base.focus + "\n" +
      "NEXT LEVEL'S FOCUS (bonus questions only): " + next.focus + "\n" +
      "Section \"spelling\" is called \"" + titles.spelling + "\"; section \"grammar\" is called \"" + titles.grammar + "\".\n" +
      "Examples showing the difficulty at this level:\n spelling:\n" + ex("spelling") + "\n grammar:\n" + ex("grammar") + "\n\n" +
      "THE STUDENT'S LAST CHECK-IN (" + rowLabel(last) + "):\n" +
      ["spelling", "grammar", "reading"].map(function (sec) { return "- " + titlesFor(SETS[last.baseSet] || base)[sec] + ": " + chainLine(last, sec); }).join("\n") + "\n" +
      "Questions they got wrong:\n" + (misses.length ? misses.slice(0, 15).join("\n") : "- none") + "\n" +
      "Short reading answers:\n" + (shortLines.join("\n") || "- none") + "\n" +
      "Writing: level " + last.writingLevel + ". Feedback: " + (last.teacherFeedback || last.aiFeedback || "none") + "\n" +
      (earlierFocus.length ? "Earlier focus areas: " + earlierFocus.join("; ") + "\n" : "") + "\n" +
      "Do NOT reuse these passages or writing prompts:\n" + avoid.join("\n") + "\n\n" +
      "Write a NEW test:\n" +
      "- spelling: 6 multiple-choice questions; grammar: 6 multiple-choice questions. About 60% give fresh practice on the specific skills the student missed (new words and sentences, never the same question). The rest cover other skills from this level's focus that were not tested last time. If they missed very little, lean toward the harder end of this level.\n" +
      "- reading: one new original passage of " + lo + "-" + hi + " words on a different topic from before, with 3 multiple-choice questions (one literal, one inference, one vocabulary-in-context) and 1 short-answer question.\n" +
      "- bonus: 4 spelling and 4 grammar multiple-choice questions pitched at the NEXT level, and 2 harder multiple-choice questions about the same passage (inference, theme, or author's craft).\n" +
      "- writing: one new prompt, different in topic or form from before, at a similar length and demand to: \"" + base.writing.prompt + "\"\n" +
      "- focusAreas: 2-4 short teacher-facing phrases naming what this test targets.\n" +
      "Every multiple-choice question: 3-4 options, exactly ONE clearly correct answer, plausible distractors that reflect common student errors (not silly ones), no \"all of the above\", answerable without pictures. \"correct\" is the 0-based index of the right option." +
      (base.readAloud ? " Keep wording very simple; questions may be read aloud." : "") + "\n\n" +
      "Reply with ONLY JSON in this shape:\n" +
      '{"focusAreas":["..."],"spelling":[{"prompt":"...","options":["...","...","..."],"correct":0}],"grammar":[{"prompt":"...","options":["..."],"correct":0}],"reading":{"title":"...","text":"paragraphs separated by \\n\\n","mc":[{"prompt":"...","options":["..."],"correct":0}],"short":["..."]},"bonus":{"spelling":[],"grammar":[],"reading":[]},"writing":{"prompt":"..."}}';

    const data = await sampleFn.json(prompt, { signal: signal, cache: false });
    if (!data || typeof data !== "object") throw new Error("too-few");

    const rd = data.reading || {};
    const bonus = data.bonus || {};
    const custom = {
      key: "custom",
      baseSet: bKey,
      createdAt: new Date().toISOString(),
      focusAreas: (Array.isArray(data.focusAreas) ? data.focusAreas : []).map(String).filter(Boolean).slice(0, 4),
      spelling: cleanMCList(data.spelling, "cs", 6),
      grammar: cleanMCList(data.grammar, "cg", 6),
      reading: {
        title: String(rd.title || "Reading").trim(),
        text: String(rd.text || "").trim(),
        items: cleanMCList(rd.mc, "cr", 3).concat((Array.isArray(rd.short) ? rd.short : []).map(String).filter(function (x) { return x.trim(); }).slice(0, 1).map(function (p, i) { return sa("crs" + (i + 1), p.trim()); }))
      },
      bonus: { spelling: cleanMCList(bonus.spelling, "bs", 4), grammar: cleanMCList(bonus.grammar, "bg", 4), reading: cleanMCList(bonus.reading, "br", 2) },
      writing: { prompt: String((data.writing && data.writing.prompt) || "").trim(), min: base.writing.min },
      verified: true
    };
    if (!custom.focusAreas.length) custom.focusAreas = ["Mixed review at " + base.label];

    // second pass: an independent answer check; drop questions it can't confirm
    if (onPhase) onPhase("Double-checking the answer key\u2026");
    const pool = [];
    ["spelling", "grammar"].forEach(function (sec) {
      custom[sec].forEach(function (q) { pool.push({ list: custom[sec], q: q, r: false }); });
      custom.bonus[sec].forEach(function (q) { pool.push({ list: custom.bonus[sec], q: q, r: false }); });
    });
    custom.reading.items.forEach(function (q) { if (q.type === "mc") pool.push({ list: custom.reading.items, q: q, r: true }); });
    custom.bonus.reading.forEach(function (q) { pool.push({ list: custom.bonus.reading, q: q, r: true }); });

    const checkPrompt =
      "Answer each multiple-choice question for a " + (isEllTrack ? "student learning English" : base.label + " English") + " quiz. Pick the single best option by its 0-based index. If a question has no correct option, more than one defensible answer, or is unclear, answer -1.\n\n" +
      "READING PASSAGE (for questions marked [R]):\n" + custom.reading.title + "\n" + custom.reading.text + "\n\nQUESTIONS:\n" +
      pool.map(function (x, i) { return i + ". " + (x.r ? "[R] " : "") + x.q.prompt.replace(/\n/g, " ") + "\n   " + x.q.options.map(function (o, j) { return j + ") " + o; }).join("   "); }).join("\n") +
      "\n\nReply with ONLY a JSON array of " + pool.length + " integers, one per question in order.";
    try {
      const answers = await sampleFn.json(checkPrompt, { signal: signal });
      if (!Array.isArray(answers) || answers.length !== pool.length) throw new Error("bad-check");
      pool.forEach(function (x, i) {
        if (Number(answers[i]) !== x.q.correct) { const k = x.list.indexOf(x.q); if (k !== -1) x.list.splice(k, 1); }
      });
    } catch (e) {
      if (e && e.code === "cancelled") throw e;
      custom.verified = false;
    }

    const readingMC = custom.reading.items.filter(function (q) { return q.type === "mc"; }).length;
    const readingShort = custom.reading.items.filter(function (q) { return q.type === "short"; }).length;
    if (custom.spelling.length < 4 || custom.grammar.length < 4 || readingMC < 2 || readingShort < 1 || custom.reading.text.length < 40 || !custom.writing.prompt) {
      throw new Error("too-few");
    }
    return custom;
  }

  function doStartPlaceholder() {}

  function doNext() {
    if (!stageComplete()) {
      state.notice = state.stage.section === "writing" ? "Please write a bit more before submitting." : "Please answer every question before continuing.";
      return render();
    }
    const sec = state.stage.section, lvl = state.stage.level;
    if (sec !== "writing" && allCorrect(sec, lvl) && lvl < maxClimb() && stageKey(sec, lvl + 1)) {
      state.answers[sec][lvl + 1] = state.answers[sec][lvl + 1] || {};
      state.notice = "";
      state.stage = { section: sec, level: lvl + 1 };
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      render(); window.scrollTo(0, 0);
      return;
    }
    state.done[sec] = lvl;
    state.skipped[sec] = null;
    goSection(SECTIONS.indexOf(sec) + 1);
  }

  function doSkipBonus() {
    const sec = state.stage.section, lvl = state.stage.level;
    state.done[sec] = lvl - 1;
    state.skipped[sec] = stageKey(sec, lvl);
    state.answers[sec][lvl] = {};
    goSection(SECTIONS.indexOf(sec) + 1);
  }

  function doBack() {
    const idx = SECTIONS.indexOf(state.stage.section);
    if (idx === 0) { state.screen = "landing"; state.notice = ""; return render(); }
    goSection(idx - 1);
  }

  async function doSubmit() {
    if (!stageComplete()) { state.notice = "Please write a bit more before submitting."; return render(); }
    const attempts = {};
    ["spelling", "grammar", "reading"].forEach(function (sec) {
      attempts[sec] = [];
      for (let lvl = 0; lvl <= state.done[sec]; lvl++) {
        const key = stageKey(sec, lvl);
        const ans = state.answers[sec][lvl] || {};
        attempts[sec].push({ set: key, answers: ans, score: scoreItems(itemsFor(key, sec, lvl, quizSrc()), ans) });
      }
    });
    const record = {
      v: 2,
      studentName: state.studentName.trim(),
      nameKey: nameKey(state.studentName),
      custom: state.custom || null,
      submittedAt: new Date().toISOString(),
      track: isEll() ? "ell" : "grade",
      baseSet: baseKey(),
      gradeKey: state.gradeKey,
      attempts: attempts,
      skipped: state.skipped,
      scores: { spelling: attempts.spelling[0].score, grammar: attempts.grammar[0].score, reading: attempts.reading[0].score },
      writing: state.writing,
      reflection: state.reflection.trim(),
      accommodations: { readAloud: readAloudOn() },
      snapshot: state.custom ? null : { readingTitle: SETS[baseKey()].reading.title, readingText: SETS[baseKey()].reading.text, writingPrompt: SETS[baseKey()].writing.prompt },
      writingLevel: "Not yet graded",
      answerGrades: {},
      aiNotes: {}
    };
    state.screen = "complete";
    state.saveState = "saving";
    render();
    try {
      await capsReady;
      if (!db) {
        await saveToForm(record);
        state.saveState = "saved";
        render();
        return;
      }
      const ref = await db.collection("submissions").add(record);
      state.saveState = "saved";
      render();
      // mark the written answers in the background so results are ready for the teacher
      if (ref && ref.id) {
        markAndSave(ref.id, normalize(ref.id, record)).catch(function () { /* teacher can mark later */ });
      }
      return;
    } catch (e) { state.saveState = "offline"; }
    render();
  }

  // Public site: each finished check-in is posted to a Netlify form, which stores it for the teacher.
  function resultLines(sub) {
    const t = titlesFor(SETS[sub.baseSet] || SETS.g4);
    return ["spelling", "grammar", "reading"].map(function (sec) { return t[sec] + ": " + chainLine(sub, sec); });
  }
  async function saveToForm(record) {
    const sub = normalize("new", record);
    const content = contentFor(sub);
    const readAns = ((sub.attempts.reading || [])[0] || { answers: {} }).answers;
    const shorts = content.reading.items.filter(function (q) { return q.type === "short"; })
      .map(function (q) { return "Q: " + q.prompt + "\nA: " + (readAns[q.id] || "(blank)"); });
    const scores = resultLines(sub);
    const summary = [
      sub.studentName + " \u2014 " + rowLabel(sub) + " \u2014 " + new Date(record.submittedAt).toLocaleString(),
      "", "AUTO-MARKED", scores.join("\n"),
      "", "READING SHORT ANSWERS (" + content.reading.title + ")", shorts.join("\n\n") || "(none)",
      "", "WRITING PROMPT", content.writing.prompt, "", "WRITING", record.writing || "(blank)",
      record.reflection ? "\nREFLECTION\n" + record.reflection : ""
    ].join("\n");
    const body = new URLSearchParams({
      "form-name": "english-check-in", "bot-field": "",
      student: sub.studentName, level: rowLabel(sub), scores: scores.join(" | "),
      summary: summary, record: JSON.stringify(record)
    }).toString();
    state.lastScores = scores;
    const res = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body });
    if (!res.ok) throw new Error("save-failed");
  }

  async function doDelete(id) {
    if (teacherState.confirmDelete !== id) { teacherState.confirmDelete = id; return render(); }
    teacherState.confirmDelete = null;
    await capsReady;
    if (!db) return;
    try {
      await db.doc("submissions/" + id).delete();
      teacherState.submissions = teacherState.submissions.filter(function (s) { return s.id !== id; });
      teacherState.openId = null;
    } catch (e) { teacherState.saveStatus[id] = "Couldn\u2019t delete \u2014 try again."; }
    render();
  }

  async function doSaveFeedback(id) {
    await capsReady;
    if (!db) return;
    const sub = teacherState.submissions.find(function (s) { return s.id === id; });
    if (!sub) return;
    const text = teacherState.feedbackDrafts[id] != null ? teacherState.feedbackDrafts[id] : sub.teacherFeedback;
    const wl = teacherState.writingLevelDrafts[id] != null ? teacherState.writingLevelDrafts[id] : sub.writingLevel;
    const grades = Object.assign({}, sub.answerGrades, teacherState.shortGradeDrafts[id] || {});
    const notes = Object.assign({}, sub.aiNotes);
    const oral = teacherState.oralDrafts[id] != null ? teacherState.oralDrafts[id] : sub.oralLanguage;
    teacherState.saveStatus[id] = "Saving\u2026"; render();
    try {
      await db.doc("submissions/" + id).update({ teacherFeedback: text, writingLevel: wl, answerGrades: grades, aiNotes: notes, oralLanguage: oral, aiCriteria: sub.aiCriteria || null, reviewed: true });
      sub.teacherFeedback = text; sub.writingLevel = wl; sub.answerGrades = grades; sub.oralLanguage = oral; sub.reviewed = true;
      teacherState.saveStatus[id] = "Saved.";
    } catch (e) { teacherState.saveStatus[id] = "Couldn\u2019t save \u2014 try again."; }
    render();
  }

  function matchLevel(str, options) {
    if (!str) return null;
    const s = String(str).toLowerCase();
    for (let i = 1; i < options.length; i++) { if (s.indexOf(options[i].split(" ")[0].toLowerCase()) !== -1) return options[i]; }
    return null;
  }

  function aiErrorText(e) {
    const code = e && e.code;
    if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].indexOf(code) !== -1) return "AI marking isn\u2019t available for this account.";
    if (code === "rate_limited") return "Too many requests right now \u2014 try again shortly.";
    if (code === "invalid_json") return "Couldn\u2019t read the AI\u2019s answer \u2014 try again.";
    return "Couldn\u2019t mark automatically \u2014 try again.";
  }

  // Marks the short answers and writing for one submission. Returns plain data; does not save.
  async function aiAssess(sub) {
    await capsReady;
    if (!sampleFn) { const err = new Error("no-sample"); err.code = "capability_disabled"; throw err; }
    const base = SETS[sub.baseSet] || SETS.g4;
    const content = contentFor(sub);
    const readAttempt = (sub.attempts.reading || [])[0] || { answers: {} };
    const shortQs = content.reading.items.filter(function (q) { return q.type === "short"; });
    const levels = writingLevelsFor(sub);
    const gradeText = sub.gradeKey && SETS[sub.gradeKey] ? SETS[sub.gradeKey].label : base.label;

    const scale = sub.track === "ell"
      ? "This student is an English Language Learner (" + gradeText + "). Place the writing on the BC English Language Learning Standards (2017) five-level scale: Beginning (1), Developing (2), Expanding (3), Consolidating (4), Bridging (5). For short answers, judge comprehension of the passage, not grammatical accuracy."
      : "This student is in " + gradeText + " in British Columbia, Canada. Use the BC proficiency scale for the writing: Emerging, Developing, Proficient, Extending, judged against " + gradeText + " English Language Arts expectations. For short answers, judge whether the response shows age-appropriate understanding of the passage.";

    const example = {
      readingShortAnswers: shortQs.map(function (q) { return { id: q.id, meetsExpectation: true, note: "one short sentence explaining the mark" }; }),
      writingLevel: levels[2],
      criteria: { meaning: levels[2], style: levels[2], form: levels[2], conventions: levels[2] },
      writingFeedback: "2-3 sentences: a specific strength, then one concrete next step.",
      writingConventionsNote: "one short sentence about spelling, grammar, or punctuation patterns to watch for"
    };

    const prompt =
      "You are helping a teacher mark a student's reading and writing. " + scale + " Also rate the writing on the four BC Performance Standards aspects \u2014 meaning (ideas and information), style (word choice and sentence variety), form (organization), and conventions (spelling, grammar, punctuation) \u2014 using the same scale. Give credit for what the student can do; do not penalize a young or English-learning student for ideas expressed simply. Write feedback for the teacher, in a warm, specific, practical voice, not addressed to the student. If an answer is blank or off-topic, say so plainly.\n\n" +
      "READING PASSAGE (" + content.reading.title + "):\n" + content.reading.text + "\n\n" +
      "SHORT-ANSWER QUESTIONS:\n" + shortQs.map(function (q) { return "Q (" + q.id + "): " + q.prompt + "\nStudent's answer: " + (readAttempt.answers[q.id] || "(blank)"); }).join("\n\n") + "\n\n" +
      "WRITING PROMPT:\n" + content.writing.prompt + "\nStudent's writing:\n" + (sub.writing || "(blank)") + "\n\n" +
      "Reply with ONLY a JSON object in exactly this shape, no extra text:\n" + JSON.stringify(example);

    const data = await sampleFn.json(prompt);
    const answerGrades = {}, aiNotes = {};
    (data.readingShortAnswers || []).forEach(function (it) {
      if (!it || !it.id) return;
      answerGrades[it.id] = it.meetsExpectation ? "Meets expectations" : "Needs support";
      if (it.note) aiNotes[it.id] = it.note;
    });
    return {
      answerGrades: answerGrades,
      aiNotes: aiNotes,
      writingLevel: matchLevel(data.writingLevel, levels),
      criteria: data.criteria && typeof data.criteria === "object" ? {
        meaning: matchLevel(data.criteria.meaning, levels), style: matchLevel(data.criteria.style, levels),
        form: matchLevel(data.criteria.form, levels), conventions: matchLevel(data.criteria.conventions, levels) } : null,
      feedback: [data.writingFeedback, data.writingConventionsNote].filter(Boolean).join(" ")
    };
  }

  // Marks and saves straight to the record (used after submit and for "Mark all").
  async function markAndSave(id, sub) {
    const r = await aiAssess(sub);
    const update = {
      aiGraded: true,
      reviewed: false,
      aiNotes: Object.assign({}, sub.aiNotes || {}, r.aiNotes),
      answerGrades: Object.assign({}, r.answerGrades, sub.answerGrades || {}),
      aiFeedback: r.feedback,
      aiCriteria: r.criteria
    };
    if (r.writingLevel && (!sub.writingLevel || sub.writingLevel === "Not yet graded")) update.writingLevel = r.writingLevel;
    if (!sub.teacherFeedback) update.teacherFeedback = r.feedback;
    await db.doc("submissions/" + id).update(update);
    return update;
  }

  // Teacher button on one submission: fills the fields for review (not saved until "Save").
  async function doGradeAI(id) {
    const sub = teacherState.submissions.find(function (s) { return s.id === id; });
    if (!sub) return;
    teacherState.aiStatus[id] = "Marking\u2026"; render();
    try {
      const r = await aiAssess(sub);
      teacherState.shortGradeDrafts[id] = Object.assign({}, teacherState.shortGradeDrafts[id] || {}, r.answerGrades);
      Object.assign(sub.aiNotes, r.aiNotes);
      if (r.writingLevel) teacherState.writingLevelDrafts[id] = r.writingLevel;
      if (r.feedback) teacherState.feedbackDrafts[id] = r.feedback;
      if (r.criteria) sub.aiCriteria = r.criteria;
      teacherState.aiStatus[id] = "Marks and feedback added below \u2014 review, then save.";
    } catch (e) { teacherState.aiStatus[id] = aiErrorText(e); }
    render();
  }

  function needsMarking(sub) { return !sub.aiGraded && !sub.reviewed && (!sub.writingLevel || sub.writingLevel === "Not yet graded"); }

  async function doMarkAll() {
    await capsReady;
    if (!sampleFn || !db) { teacherState.bulkStatus = "AI marking isn\u2019t available in this view."; return render(); }
    const todo = teacherState.submissions.filter(needsMarking);
    if (!todo.length) { teacherState.bulkStatus = "Everything is already marked."; return render(); }
    let done = 0, failed = 0;
    for (let i = 0; i < todo.length; i++) {
      teacherState.bulkStatus = "Marking " + (i + 1) + " of " + todo.length + "\u2026"; render();
      try { Object.assign(todo[i], await markAndSave(todo[i].id, todo[i])); done++; }
      catch (e) { failed++; if (e && e.code === "rate_limited") { teacherState.bulkStatus = "Paused: too many requests. Marked " + done + "; try again shortly."; return render(); } }
    }
    teacherState.bulkStatus = "Marked " + done + (failed ? ", " + failed + " couldn\u2019t be marked" : "") + ".";
    render();
  }

  render();

})();
</script>
</body>
</html>
