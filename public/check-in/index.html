<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>if (/github\.io$/.test(location.hostname)) location.replace("https://sonny-english-check-in.netlify.app/");</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-12 English Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2E8D5;
    --paper-light: #FBF7EC;
    --ink: #202A2E;
    --ink-soft: #55625F;
    --pine: #2F6F4E;
    --pine-dark: #1F3D33;
    --pencil: #B23A2E;
    --pencil-light: #F3DAD3;
    --line: #D9CCA6;
    --focus: #1F6FEB;
    --radius: 10px;
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1B1E19;
      --paper-light: #23271F;
      --ink: #ECE5D5;
      --ink-soft: #B4AC98;
      --pine: #6FCF97;
      --pine-dark: #0F1A15;
      --pencil: #E0897C;
      --pencil-light: #3A2420;
      --line: #3A3F33;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B1E19;
    --paper-light: #23271F;
    --ink: #ECE5D5;
    --ink-soft: #B4AC98;
    --pine: #6FCF97;
    --pine-dark: #0F1A15;
    --pencil: #E0897C;
    --pencil-light: #3A2420;
    --line: #3A3F33;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; margin: 0 0 .4em; color: var(--ink); }
  p { margin: 0 0 1em; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .topbar {
    background: var(--pine-dark);
    color: var(--paper-light);
    padding: env(safe-area-inset-top, 0px) 0 0 0;
  }
  .topbar-inner {
    max-width: 700px;
    margin: 0 auto;
    padding: 18px 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .topbar-inner h1 { color: var(--paper-light); font-size: 1.25rem; margin: 0; }
  .topbar-sub { font-size: .82rem; opacity: .78; font-family: "Atkinson Hyperlegible", sans-serif; }

  main { max-width: 700px; margin: 0 auto; padding: 28px 20px 60px; }

  .card {
    background: var(--paper-light);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 28px 26px;
  }

  .progress-row { display: flex; gap: 6px; margin-bottom: 22px; }
  .progress-tab {
    flex: 1;
    text-align: center;
    font-size: .78rem;
    padding: 8px 4px;
    border-bottom: 3px solid var(--line);
    color: var(--ink-soft);
  }
  .progress-tab.is-active { border-bottom-color: var(--pencil); color: var(--ink); font-weight: 700; }
  .progress-tab.is-done { border-bottom-color: var(--pine); color: var(--ink); }

  label.field-label { display: block; font-weight: 700; margin-bottom: 6px; }
  input[type="text"], textarea, select {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  textarea.short-answer { min-height: 80px; }
  select { min-height: 44px; }

  .question { margin-bottom: 26px; }
  .question:last-child { margin-bottom: 0; }
  .question-prompt { font-weight: 700; margin-bottom: 10px; }
  .options { display: grid; gap: 8px; }
  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    background: var(--paper);
  }
  .option:has(input:checked) { border-color: var(--pine); background: color-mix(in srgb, var(--pine) 12%, var(--paper)); }
  .option input { accent-color: var(--pine); width: 18px; height: 18px; flex-shrink: 0; }
  .short-tag { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--pencil); border: 1px solid var(--pencil); border-radius: 20px; padding: 1px 9px; margin-bottom: 8px; }

  .passage {
    background: var(--paper);
    border-left: 4px solid var(--pencil);
    padding: 16px 18px;
    border-radius: 4px;
    margin-bottom: 24px;
    font-size: .98rem;
  }
  .passage h3 { font-size: 1.05rem; margin-bottom: .5em; }

  .btn-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; }
  button {
    font-family: inherit;
    font-size: .98rem;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-primary { background: var(--pine-dark); color: var(--paper-light); margin-left: auto; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn-ghost:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ai { background: var(--pencil); color: var(--paper-light); }
  .btn-ai:disabled { opacity: .55; cursor: not-allowed; }
  .btn-small { padding: 8px 14px; font-size: .85rem; }

  .notice { font-size: .88rem; color: var(--pencil); margin-top: 10px; min-height: 1.2em; }
  .hint { font-size: .85rem; color: var(--ink-soft); margin-top: -8px; margin-bottom: 18px; }

  .landing-title { font-size: 1.7rem; }
  .section-list { list-style: none; padding: 0; margin: 18px 0 26px; display: grid; gap: 8px; }
  .section-list li { padding: 10px 4px; border-bottom: 1px solid var(--line); color: var(--ink-soft); font-size: .95rem; }
  .section-list li b { color: var(--ink); }

  .complete-mark { width: 56px; height: 56px; border-radius: 50%; background: var(--pine); color: var(--paper-light); display: flex; align-items: center; justify-content: center; font-family: "Fraunces", serif; font-size: 1.6rem; margin-bottom: 16px; }

  .teacher-link { text-align: center; margin-top: 30px; }
  .teacher-link a { color: var(--ink-soft); font-size: .82rem; text-decoration: underline; cursor: pointer; }

  .sub-item {
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 10px;
    background: var(--paper);
    overflow: hidden;
  }
  .sub-head {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .sub-head:hover { background: color-mix(in srgb, var(--pine) 6%, var(--paper)); }
  .sub-name { font-weight: 700; }
  .sub-date { font-size: .8rem; color: var(--ink-soft); }
  .sub-scores { font-size: .82rem; color: var(--ink-soft); text-align: right; }
  .sub-body { padding: 0 16px 18px; border-top: 1px solid var(--line); }
  .detail-q { padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
  .detail-q:last-child { border-bottom: none; }
  .tag-correct { color: var(--pine); font-weight: 700; }
  .tag-wrong { color: var(--pencil); font-weight: 700; }
  .writing-block { background: var(--paper-light); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 10px 0; white-space: pre-wrap; font-size: .95rem; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }
  .save-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  .save-status { font-size: .82rem; color: var(--pine); }
  .grade-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .grade-row select { width: auto; min-width: 190px; padding: 8px 10px; }
  .ai-note { font-size: .85rem; color: var(--ink-soft); font-style: italic; margin-top: 4px; }
  .field-inline { margin-top: 14px; }
    
  .muted { color: var(--ink-soft); }
  .small { font-size: .82rem; }
  .ok-line { color: var(--pine); font-weight: 700; }
  .err-line { color: var(--pencil); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 560px) { .two-col { grid-template-columns: 1fr; } }
  .bonus-flag { display: inline-block; font-weight: 700; color: var(--pencil); border: 1px solid var(--pencil); border-radius: 20px; padding: 4px 14px; margin-bottom: 10px; font-size: .85rem; }
  .bonus-intro { color: var(--ink-soft); font-size: .88rem; margin-bottom: 18px; }
  .passage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .listen-btn { font-size: .75rem; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--line); background: var(--paper-light); color: var(--ink); font-weight: 700; vertical-align: middle; cursor: pointer; }
  .teacher-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter { margin-top: 14px; }
  .sub-scores div { white-space: nowrap; }
  @media (max-width: 560px) { .sub-head { flex-direction: column; align-items: flex-start; } .sub-scores { text-align: left; } .sub-scores div { white-space: normal; } }
  .profile { background: var(--paper-light); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 14px 0 8px; }
  .profile-title { font-weight: 700; font-size: .88rem; margin-bottom: 8px; }
  .pill { display: inline-block; border: 1px solid var(--pine); color: var(--ink); border-radius: 20px; padding: 2px 10px; font-size: .8rem; margin: 0 6px 6px 0; }
  .detail-h { font-size: 1rem; margin-top: 16px; }
  .align { margin-top: 18px; }
  .align summary { cursor: pointer; font-weight: 700; font-family: "Fraunces", Georgia, serif; }
  .align-row { font-size: .85rem; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .align hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  .bulk-row { margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: .7rem; font-weight: 700; border: 1px solid var(--pencil); color: var(--pencil); border-radius: 20px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
  .badge-ok { border-color: var(--pine); color: var(--pine); }
  .badge-muted { border-color: var(--line); color: var(--ink-soft); }
  .ai-banner { background: var(--pencil-light); border-radius: 8px; padding: 10px 12px; font-size: .88rem; margin: 12px 0 4px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--pine); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .focus-list { margin: 0 0 12px 1.1em; padding: 0; }
  .focus-list li { margin-bottom: 4px; }
  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .92rem; cursor: pointer; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--pine); }
  .result-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  .result-table td { padding: 5px 0; border-bottom: 1px dashed var(--line); vertical-align: top; }
  .result-table td:last-child { text-align: right; font-weight: 700; padding-left: 10px; }
  .criteria { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: -2px 0 8px; color: var(--ink-soft); }
  .btn-link { background: none; border: none; padding: 4px 0; margin-left: auto; color: var(--pencil); font-size: .8rem; font-weight: 400; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <h1>English Check-In</h1>
    <span class="topbar-sub" id="topbarSub">K–12 · ELL</span>
  </div>
</div>
<main id="app"></main>
<form name="english-check-in" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="student">
  <input type="text" name="level">
  <input type="text" name="scores">
  <textarea name="summary"></textarea>
  <input type="text" name="record">
  <input type="text" name="bot-field">
</form>
<script>
(function () {
  "use strict";
  // ================= CONTENT =================
  function mc(id, prompt, options, correct) { return { id: id, type: "mc", prompt: prompt, options: options, correct: correct }; }
  function sa(id, prompt) { return { id: id, type: "short", prompt: prompt }; }

  const SETS = {
    k: {
      key: "k", label: "Kindergarten", short: "K", band: "k", readAloud: true,
      focus: "Phonological awareness (rhyme, initial sounds), letter knowledge, concepts of print, simple story elements",
      spelling: [
        mc("s1", "Which letter does the word \u201ccat\u201d start with?", ["c", "b", "s"], 0),
        mc("s2", "Which word rhymes with \u201chat\u201d?", ["cat", "dog", "sun"], 0),
        mc("s3", "Which word rhymes with \u201cpig\u201d?", ["big", "pen", "cup"], 0),
        mc("s4", "Which letter does the word \u201csun\u201d start with?", ["m", "s", "t"], 1),
        mc("s5", "Which word starts with the same sound as \u201cball\u201d?", ["bat", "fish", "ten"], 0)
      ],
      grammar: [
        mc("g1", "How many words are in this sentence? \u201cI see a dog.\u201d", ["3", "4", "5"], 1),
        mc("g2", "Which one is a capital letter?", ["a", "A", "b"], 1),
        mc("g3", "What goes at the end of a telling sentence?", ["a period (.)", "a comma (,)", "nothing"], 0),
        mc("g4", "Which word is the name of an animal?", ["cat", "run", "big"], 0),
        mc("g5", "Which one is a sentence?", ["The dog runs.", "dog the", "runs"], 0)
      ],
      reading: {
        title: "Sam\u2019s Red Ball",
        text: "Sam has a red ball. He kicks the ball to his mom. The ball goes up, up, up! Mom catches the ball. Sam and Mom laugh.",
        items: [
          mc("r1", "What colour is Sam\u2019s ball?", ["red", "blue", "green"], 0),
          mc("r2", "Who catches the ball?", ["Sam", "Mom", "a dog"], 1),
          mc("r3", "How do Sam and Mom feel at the end?", ["happy", "sad", "angry"], 0),
          sa("rs1", "What happened after Sam kicked the ball? (Your teacher can type for you.)")
        ]
      },
      writing: { prompt: "Type one sentence about your favourite animal. (Your teacher can type what you say.)", min: 5 }
    },

    g1: {
      key: "g1", label: "Grade 1", short: "G1", band: "primary", readAloud: true,
      focus: "Phonics and word patterns, simple plurals, capitals and end punctuation, nouns and verbs, retelling and recall",
      spelling: [
        mc("s1", "Which word is spelled correctly?", ["frog", "frogg", "frug"], 0),
        mc("s2", "Which word is spelled correctly?", ["teh", "the", "tha"], 1),
        mc("s3", "Fill in the missing letter: f _ sh (it swims in water)", ["i", "a", "u"], 0),
        mc("s4", "Which word has the long \u201ca\u201d sound, like in \u201ccake\u201d?", ["cap", "made", "cat"], 1),
        mc("s5", "One dog, two ___.", ["dog", "dogs", "doges"], 1)
      ],
      grammar: [
        mc("g1", "Which sentence starts correctly?", ["the cat sat.", "The cat sat.", "the Cat sat."], 1),
        mc("g2", "Which word is a naming word (noun)?", ["jump", "tree", "happy"], 1),
        mc("g3", "Which word is an action word (verb)?", ["run", "red", "box"], 0),
        mc("g4", "What goes at the end of a question?", ["a period (.)", "a question mark (?)", "an exclamation mark (!)"], 1),
        mc("g5", "\u201cMy friend emma likes pizza.\u201d Which word needs a capital letter?", ["friend", "emma", "pizza"], 1)
      ],
      reading: {
        title: "The Lost Mitten",
        text: "Ava lost her blue mitten at the park. She looked under the slide. She looked by the swings. Then her dog, Max, ran to her. Max had the mitten in his mouth! Ava gave Max a big hug.",
        items: [
          mc("r1", "What did Ava lose?", ["a hat", "a blue mitten", "a ball"], 1),
          mc("r2", "Where did Ava look first?", ["under the slide", "by the swings", "at home"], 0),
          mc("r3", "Who found the mitten?", ["Ava\u2019s mom", "Max the dog", "a friend"], 1),
          sa("rs1", "Why did Ava give Max a hug?")
        ]
      },
      writing: { prompt: "Write 2 or 3 sentences about something you like to do with your family.", min: 15 }
    },

    g2: {
      key: "g2", label: "Grade 2", short: "G2", band: "primary", readAloud: true,
      focus: "High-frequency words, homophones, -ing endings, compound words, adjectives, past tense, subject-verb agreement, sequence words in informational text",
      spelling: [
        mc("s1", "Which word is spelled correctly?", ["frend", "friend", "freind"], 1),
        mc("s2", "Which word is spelled correctly?", ["whent", "went", "wint"], 1),
        mc("s3", "Choose the right word: \u201cI ___ two apples.\u201d", ["ate", "eight", "eigth"], 0),
        mc("s4", "run + ing =", ["runing", "running", "runeing"], 1),
        mc("s5", "Which word is a compound word (two words put together)?", ["sunshine", "sunny", "running"], 0)
      ],
      grammar: [
        mc("g1", "Which word is the describing word (adjective)? \u201cThe fluffy cat slept.\u201d", ["fluffy", "cat", "slept"], 0),
        mc("g2", "\u201cYesterday I ___ to the park.\u201d", ["walk", "walked", "walking"], 1),
        mc("g3", "Which one is a complete sentence?", ["The bird.", "The bird sang a song.", "Sang a song."], 1),
        mc("g4", "\u201cMia and Leo ___ friends.\u201d", ["is", "are", "am"], 1),
        mc("g5", "Which word means the opposite of \u201chot\u201d?", ["warm", "cold", "sunny"], 1)
      ],
      reading: {
        title: "A Seed\u2019s Journey",
        text: "A seed is very small, but it can grow into a big plant. First, the seed is planted in soil. Next, it needs water and sunlight. Soon, a tiny root grows down and a green shoot grows up. After many weeks, the shoot becomes a plant with leaves. Some plants even grow flowers and new seeds!",
        items: [
          mc("r1", "What does a seed need to grow?", ["water and sunlight", "snow and wind", "nothing"], 0),
          mc("r2", "What grows down into the soil?", ["a leaf", "a root", "a flower"], 1),
          mc("r3", "The words \u201cFirst\u201d and \u201cNext\u201d help the reader know\u2026", ["the order things happen", "how big the seed is", "what colour the plant is"], 0),
          sa("rs1", "In your own words, how does a seed become a plant?")
        ]
      },
      writing: { prompt: "Write 3 or 4 sentences explaining how to do something you know well (like making a sandwich). Use the words first, next, and last.", min: 25 }
    },

    g3: {
      key: "g3", label: "Grade 3", short: "G3", band: "primary", readAloud: false,
      focus: "Common spelling patterns, plurals (y to ies), prefixes, adverbs, possessives, contractions, sentence types, character feelings and inference",
      spelling: [
        mc("s1", "Which word is spelled correctly?", ["afraid", "afrayd", "afriad"], 0),
        mc("s2", "Which word is spelled correctly?", ["minite", "minute", "minnit"], 1),
        mc("s3", "Choose the right word: \u201cCan you ___ the music?\u201d", ["here", "hear", "heer"], 1),
        mc("s4", "One baby, two ___.", ["babys", "babies", "babyes"], 1),
        mc("s5", "Which word has a prefix that means \u201cagain\u201d?", ["redo", "read", "ready"], 0)
      ],
      grammar: [
        mc("g1", "Which word is the adverb (tells how)? \u201cThe turtle walked slowly.\u201d", ["turtle", "walked", "slowly"], 2),
        mc("g2", "Which shows that the bone belongs to one dog?", ["the dogs bone", "the dog\u2019s bone", "the dogs\u2019 bone"], 1),
        mc("g3", "\u201cThe children ___ playing outside.\u201d", ["is", "are", "am"], 1),
        mc("g4", "Which is the contraction for \u201cdo not\u201d?", ["dont", "don\u2019t", "do\u2019nt"], 1),
        mc("g5", "Which sentence is a question?", ["Close the door.", "Where is my coat?", "What a great day!"], 1)
      ],
      reading: {
        title: "Lena\u2019s Science Fair",
        text: "Lena wanted her science fair project to be special. She decided to test which paper towel soaked up the most water. She poured the same amount of water on three different towels. Then she measured how much water was left over. The thick towel soaked up almost all of it. The thin towel barely helped at all.\n\nOn the day of the fair, Lena was nervous. Her hands shook, but she explained her results clearly. A judge smiled and said, \u201cYou tested it fairly. That is what real scientists do.\u201d",
        items: [
          mc("r1", "What was Lena testing?", ["which paper towel soaked up the most water", "which towel was softest", "how fast water dries"], 0),
          mc("r2", "Which towel worked best?", ["the thin one", "the thick one", "they were all the same"], 1),
          mc("r3", "Why did Lena use the same amount of water each time?", ["to make the test fair", "because she ran out of water", "because it was faster"], 0),
          sa("rs1", "How did Lena feel at the start of the fair, and how do you think she felt at the end? Explain.")
        ]
      },
      writing: { prompt: "Write a paragraph about a time you tried something for the first time. Tell what happened and how you felt.", min: 40 }
    },

    g4: {
      key: "g4", label: "Grade 4", short: "G4", band: "intermediate", readAloud: false,
      focus: "Canadian spelling, homophones, irregular plurals, parts of speech, verb tense, punctuation, its/it\u2019s, literal and inferential comprehension, paragraph writing",
      spelling: [
        mc("sp1", "Which word is spelled correctly?", ["Becuase", "Beacause", "Because", "Becaus"], 2),
        mc("sp2", "Which word is spelled correctly?", ["Diffrent", "Different", "Differant", "Differnt"], 1),

    if (section === "reading") return level > 0 ? s.reading.items.filter(function (q) { return q.type === "mc"; }) : s.reading.items;
    return s[section] || [];
  }
  function scoreItems(items, answers) {
    let c = 0, t = 0;
    items.forEach(function (q) { if (q.type === "mc") { t++; if (answers && answers[q.id] === q.correct) c++; } });
    return { correct: c, total: t };
  }

  // seeded shuffle so answer positions vary but stay stable for a question
  function rng(seed) { let a = seed; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function orderFor(n, seed) {
    const idx = []; for (let i = 0; i < n; i++) idx.push(i);
    const r = rng(hash(seed));
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp; }
    return idx;
  }

  function freshState() {
    return {
      screen: "landing",
      studentName: "",
      gradeKey: "g4",
      ellChoice: "",
      stage: { section: "spelling", level: 0 },
      answers: { spelling: [{}, {}, {}, {}, {}], grammar: [{}, {}, {}, {}, {}], reading: [{}, {}, {}, {}, {}] },
      done: { spelling: 0, grammar: 0, reading: 0 },
      skipped: { spelling: null, grammar: null, reading: null },
      writing: "",
      notice: "",
      saveState: "idle",
      custom: null,
      prev: null,
      genError: "",
      genPhase: "",
      readAloudChoice: null,
      reflection: ""
    };
  }
  let state = freshState();

  let teacherState = {
    loaded: false, loading: false, error: null, submissions: [], openId: null, filter: "", bulkStatus: "", oralDrafts: {}, confirmDelete: null,
    feedbackDrafts: {}, saveStatus: {}, shortGradeDrafts: {}, writingLevelDrafts: {}, aiStatus: {}
  };

  let db = null, sampleFn = null;
  const capsReady = (async function () {
    if (!(window.claude && typeof window.claude.use === "function")) return;
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    try { sampleFn = await window.claude.use("sample"); } catch (e) { sampleFn = null; }
  })();

  const app = document.getElementById("app");
  const topbarSub = document.getElementById("topbarSub");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- ladder helpers ----------
  function isEll() { return !!state.ellChoice; }
  function ladder() { return isEll() ? ELL_LADDER : GRADE_LADDER; }
  function baseKey() {
    if (!isEll()) return state.gradeKey;
    return state.ellChoice === "ell-unsure" ? "ell1" : state.ellChoice;
  }
  function maxClimb() { return isEll() ? 4 : 2; }
  function setKeyAt(level) { const l = ladder(); const i = l.indexOf(baseKey()) + level; return l[i] || null; }
  function quizSrc() { return { custom: state.custom, baseSet: baseKey() }; }
  function stageKey(section, level) {
    if (state.custom) {
      if (level === 0) return "custom";
      if (level === 1 && state.custom.bonus && (state.custom.bonus[section] || []).length) return "custom+";
    }
    return setKeyAt(level);
  }

  function allCorrect(section, level) {
    const items = itemsFor(stageKey(section, level), section, level, quizSrc()).filter(function (q) { return q.type === "mc"; });
    const ans = state.answers[section][level];
    return items.length > 0 && items.every(function (q) { return ans[q.id] === q.correct; });
  }

  function readAloudOn() { return state.readAloudChoice == null ? !!SETS[baseKey()].readAloud : !!state.readAloudChoice; }
  function speechOK() { return typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined"; }
  function speak(text) {
    if (!speechOK()) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-CA"; u.rate = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }
  function listenBtn(text) {
    if (!speechOK()) return "";
    return '<button class="listen-btn" data-action="speak" data-speak="' + esc(text) + '" aria-label="Read aloud">Listen</button>';
  }

  // ---------- rendering ----------
  function render() {
    if (state.screen === "landing") { topbarSub.textContent = "K\u201312 \u00b7 ELL"; app.innerHTML = renderLanding(); }
    else if (state.screen === "preparing") { topbarSub.textContent = "Preparing"; app.innerHTML = renderPreparing(); }
    else if (state.screen === "intro") { topbarSub.textContent = "Welcome back"; app.innerHTML = renderIntro(); }
    else if (state.screen === "quiz") { topbarSub.textContent = SETS[baseKey()].label; app.innerHTML = renderQuiz(); }
    else if (state.screen === "complete") { topbarSub.textContent = "Complete"; app.innerHTML = renderComplete(); }
    else if (state.screen === "teacher") { topbarSub.textContent = "Teacher view"; app.innerHTML = renderTeacher(); }
    attach();
  }

  function renderLanding() {
    return (
      '<div class="card">' +
        '<h2 class="landing-title">Before we start</h2>' +
        '<p class="muted">A short check-in with four parts: word work, grammar, reading, and writing. It adjusts to the student\u2019s level \u2014 ace a part and harder questions unlock automatically.</p>' +
        '<label class="field-label" for="studentName">Student\u2019s name</label>' +
        '<input type="text" id="studentName" autocomplete="off" value="' + esc(state.studentName) + '" placeholder="Type your name here">' +
        '<div class="hint" style="margin-top:6px;margin-bottom:0">First name or initials is enough. Use the same spelling each time so later check-ins can build on this one.</div>' +
        '<div class="two-col">' +
          '<div><label class="field-label" for="gradeSelect">Grade</label>' +
          '<select id="gradeSelect" data-role="grade">' +
            GRADE_OPTIONS.map(function (o) { return '<option value="' + o.key + '"' + (o.key === state.gradeKey ? " selected" : "") + '>' + esc(o.label) + '</option>'; }).join("") +
          '</select></div>' +
          '<div><label class="field-label" for="ellSelect">English Language Learner?</label>' +
          '<select id="ellSelect" data-role="ell">' +
            ELL_OPTIONS.map(function (o) { return '<option value="' + o.key + '"' + (o.key === state.ellChoice ? " selected" : "") + '>' + esc(o.label) + '</option>'; }).join("") +
          '</select></div>' +
        '</div>' +
        (speechOK() ? '<label class="check-row"><input type="checkbox" data-role="readaloud"' + (readAloudOn() ? " checked" : "") + '> Read-aloud support (Listen buttons)</label>' : '') +
        '<p class="hint" style="margin-top:10px">' + (isEll()
          ? "ELL track: uses the five BC ELL Standards levels (Beginning to Bridging). Questions climb a level each time a section is perfect."
          : "Grade track: matched to the BC English Language Arts curriculum for the chosen grade. A perfect section unlocks up to two grades higher.") + '</p>' +
        '<div class="notice">' + esc(state.notice) + '</div>' +
        '<div class="btn-row"><button class="btn-primary" data-action="start">Start check-in</button></div>' +
      '</div>' +
''
    );
  }

  function renderQuiz() {
    const base = SETS[baseKey()];
    const titles = titlesFor(base);
    const section = state.stage.section;
    const level = state.stage.level;
    const src = quizSrc();
    const setKey = section === "writing" ? (state.custom ? "custom" : baseKey()) : stageKey(section, level);
    const content = contentFor(src);
    const secIdx = SECTIONS.indexOf(section);
    const speakOn = readAloudOn();
    let body = "";

    if (level > 0) {
      body += '<div class="bonus-flag">Bonus round \u2014 ' + esc(setLabel(setKey, src).replace(" (new form)", "")) + ' level</div>' +
        '<p class="bonus-intro">Perfect score! These questions are a step harder. Skipping is fine \u2014 it won\u2019t count against you.</p>';
    }

    if (section === "reading") {
      const pass = passageFor(setKey, src);
      body += '<div class="passage"><div class="passage-head"><h3>' + esc(pass.title) + '</h3>' + (speakOn ? listenBtn(pass.title + ". " + pass.text) : "") + '</div>' +
        pass.text.split("\n\n").map(function (p) { return '<p>' + esc(p).replace(/\n/g, "<br>") + '</p>'; }).join("") + '</div>';
    }
    if (section === "writing") {
      body += '<div class="question-prompt">' + esc(content.writing.prompt) + (speakOn ? " " + listenBtn(content.writing.prompt) : "") + '</div>' +
        '<textarea id="writingArea" placeholder="Write here...">' + esc(state.writing) + '</textarea>' +
        '<div class="hint" id="writingCount">' + writingCountText() + '</div>' +
        '<label class="field-label" for="reflectionArea" style="margin-top:18px">Think about today (optional)</label>' +
        '<div class="hint" style="margin-top:0">What is one thing you did well, and one thing you want to get better at?' + (speakOn ? " " + listenBtn("Think about today. What is one thing you did well, and one thing you want to get better at?") : "") + '</div>' +
        '<textarea id="reflectionArea" class="short-answer" placeholder="I did well at... I want to get better at...">' + esc(state.reflection) + '</textarea>';
    } else {
      body += itemsFor(setKey, section, level, src).map(function (q) {
        return q.type === "short" ? renderShortQ(section, level, q, speakOn) : renderMC(section, level, setKey, q, speakOn);
      }).join("");
    }

    const isLast = section === "writing";
    return (
      '<div class="progress-row">' + SECTIONS.map(function (s, i) {
        const cls = s === section ? "is-active" : (i < secIdx ? "is-done" : "");
        return '<div class="progress-tab ' + cls + '">' + esc(titles[s]) + '</div>';
      }).join("") + '</div>' +
      '<div class="card">' + body +
        '<div class="notice">' + esc(state.notice) + '</div>' +
        '<div class="btn-row">' +
          (level > 0 ? '<button class="btn-ghost" data-action="skip-bonus">Skip bonus</button>'
            : '<button class="btn-ghost" data-action="back">' + (secIdx === 0 ? "Cancel" : "Back") + '</button>') +
          '<button class="btn-primary" data-action="' + (isLast ? "submit" : "next") + '">' + (isLast ? "Submit" : "Next") + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function renderMC(section, level, setKey, q, speakOn) {
    const chosen = state.answers[section][level][q.id];
    const order = orderFor(q.options.length, setKey + ":" + q.id);
    const name = section + "-" + level + "-" + q.id;
    return (
      '<div class="question">' +
        '<div class="question-prompt">' + esc(q.prompt).replace(/\n/g, "<br>") + (speakOn ? " " + listenBtn(q.prompt + " " + order.map(function (i) { return q.options[i]; }).join(", ")) : "") + '</div>' +
        '<div class="options">' +
          order.map(function (i) {
            return '<label class="option"><input type="radio" name="' + esc(name) + '" value="' + i + '" data-section="' + section + '" data-level="' + level + '" data-qid="' + esc(q.id) + '"' + (chosen === i ? " checked" : "") + '> <span>' + esc(q.options[i]) + '</span></label>';
          }).join("") +
        '</div>' +
      '</div>'
    );
  }

  function renderShortQ(section, level, q, speakOn) {
    const val = state.answers[section][level][q.id] || "";
    return (
      '<div class="question">' +
        '<span class="short-tag">Short answer</span>' +
        '<div class="question-prompt">' + esc(q.prompt) + (speakOn ? " " + listenBtn(q.prompt) : "") + '</div>' +
        '<textarea class="short-answer" data-role="short-answer" data-section="' + section + '" data-level="' + level + '" data-qid="' + esc(q.id) + '" placeholder="Write your answer...">' + esc(val) + '</textarea>' +
      '</div>'
    );
  }

  function writingCountText() {
    const words = state.writing.trim().length ? state.writing.trim().split(/\s+/).length : 0;
    return words + " word" + (words === 1 ? "" : "s");
  }

  function renderComplete() {
    let saveLine = "";
    if (state.saveState === "saved") saveLine = '<p class="ok-line">Saved for your teacher.</p>';
    else if (state.saveState === "offline") saveLine = '<p class="err-line">This device couldn\u2019t save your results right now \u2014 let your teacher know.</p>';
    else if (state.saveState === "saving") saveLine = '<p class="muted">Saving\u2026</p>';
    return (
      '<div class="card">' +
        '<div class="complete-mark">\u2713</div>' +
        '<h2>Nice work, ' + esc(state.studentName || "there") + '!</h2>' +
        '<p>You finished all four parts. Your teacher will look over your answers and talk with you about them.</p>' +
        (state.lastScores ? '<div class="profile"><div class="profile-title">Your marks so far</div>' + state.lastScores.map(function (l) { return '<div class="small">' + esc(l) + '</div>'; }).join("") + '<div class="small">Writing: your teacher will mark this.</div></div>' : '') +
        saveLine +
        '<div class="btn-row"><button class="btn-primary" data-action="restart">Start a new check-in</button></div>' +

    );

  // ---------- teacher ----------
  function normalize(id, data) {
    const common = {
      id: id,
      studentName: data.studentName || "Unnamed",
      submittedAt: data.submittedAt,
      writing: data.writing || "",
      teacherFeedback: data.teacherFeedback || "",
      writingLevel: data.writingLevel || "Not yet graded",
      answerGrades: data.answerGrades || {},
      aiNotes: data.aiNotes || {},
      aiFeedback: data.aiFeedback || "",
      aiGraded: !!data.aiGraded,
      reviewed: !!data.reviewed,
      custom: data.custom || null,
      snapshot: data.snapshot || null,
      reflection: data.reflection || "",
      accommodations: data.accommodations || {},
      oralLanguage: data.oralLanguage || "Not observed",
      aiCriteria: data.aiCriteria || null
    };
    if (data.v === 2) {
      return Object.assign(common, {
        track: data.track || "grade",
        baseSet: data.baseSet || "g4",
        gradeKey: data.gradeKey || null,
        attempts: data.attempts || { spelling: [], grammar: [], reading: [] },
        skipped: data.skipped || {}
      });
    }
    // earlier single-grade version
    const ans = data.answers || {};
    const attempts = {}, skipped = {};
    ["spelling", "grammar", "reading"].forEach(function (sec) {
      attempts[sec] = [{ set: "g4", answers: ans[sec] || {}, score: scoreItems(itemsFor("g4", sec, 0), ans[sec] || {}) }];
      const b = data.bonus && data.bonus[sec];
      if (b && b.offered) {
        if (b.completed) attempts[sec].push({ set: "legacy", answers: b.answers || {}, score: scoreItems(LEGACY_BONUS[sec], b.answers || {}) });
        else skipped[sec] = "legacy";
      }
    });
    return Object.assign(common, { track: "grade", baseSet: "g4", gradeKey: "g4", attempts: attempts, skipped: skipped });
  }

  function chainLine(sub, sec) {
    const list = (sub.attempts[sec] || []).map(function (a) { return setShort(a.set, sub) + " " + a.score.correct + "/" + a.score.total; });
    if (sub.skipped && sub.skipped[sec]) list.push(setShort(sub.skipped[sec], sub) + " skipped");
    return list.join(" \u2192 ");
  }

  const AREA_NAMES = {
    spelling: "Word study & conventions",
    grammar: "Language structures & conventions",
    reading: "Comprehend & connect (reading)",
    writing: "Create & communicate (writing)"
  };
  function gradeIndex(key) { return GRADE_LADDER.indexOf(key); }
  function areaPct(sub, sec, i) {
    const a = (sub.attempts[sec] || [])[i];
    if (!a || !a.score) return null;
    let c = a.score.correct, t = a.score.total;
    if (sec === "reading" && i === 0) {
      contentFor(sub).reading.items.forEach(function (q) {
        if (q.type !== "short") return;
        const g = sub.answerGrades[q.id];
        if (g === "Meets expectations") { c++; t++; } else if (g === "Needs support") { t++; }
      });
    }
    return t ? c / t : null;
  }
  // Indicative only: K-9 uses BC's proficiency scale; 10-12 courses report percentages; ELL uses the ELL Standards levels.
  function areaResult(sub, sec) {
    const p0 = areaPct(sub, sec, 0), p1 = areaPct(sub, sec, 1);
    if (p0 == null) return "\u2014";
    const pct = Math.round(p0 * 100) + "%";
    if (sub.track === "ell") {
      let best = null;
      (sub.attempts[sec] || []).forEach(function (a, i) { const p = areaPct(sub, sec, i); if (p != null && p >= 0.8) best = a.set; });
      const baseLbl = SETS[sub.baseSet].label.replace("ELL ", "");
      if (!best) return "Not yet consistent at " + baseLbl + " (" + pct + ")";
      const lbl = best.indexOf("custom") === 0 ? setLabel(best, sub).replace(" (new form)", "") : SETS[best].label;
      return "Working at " + lbl.replace("ELL ", "") + " (" + pct + " at start level)";
    }
    if (gradeIndex(sub.baseSet) >= gradeIndex("g10")) return pct + " at " + SETS[sub.baseSet].label + " level";
    let lvl = p0 >= 0.8 ? "Proficient" : p0 >= 0.5 ? "Developing" : "Emerging";
    if (p0 >= 0.9 && p1 != null && p1 >= 0.8) lvl = "Extending";
    return lvl + " (" + pct + ")";
  }

  function reachedLabel(sub, sec) {
    // highest level with a perfect score
    let best = null;
    (sub.attempts[sec] || []).forEach(function (a) { if (a.score.total > 0 && a.score.correct === a.score.total) best = a.set; });
    return best ? setShort(best, sub).replace(" new", "") : "below " + setShort(sub.baseSet, sub);
  }

  function rowLabel(sub) {
    if (sub.track === "ell") return SETS[sub.baseSet].label.replace(" (", " start (") + (sub.gradeKey && SETS[sub.gradeKey] ? " \u00b7 " + SETS[sub.gradeKey].label : "");
    return SETS[sub.baseSet] ? SETS[sub.baseSet].label : sub.baseSet;
  }

  function renderTeacher() {
    let head = '<div class="card">' +
      '<div class="teacher-head">' +
        '<h2 style="margin:0">Results</h2>' +
        '<div style="display:flex;gap:8px">' +

    if (!db) return head + '<p class="notice" style="margin-top:14px">Results storage isn\u2019t available in this view, so past check-ins can\u2019t be loaded here.</p></div>' + renderAlignment();

    if (teacherState.error) return head + '<p class="notice" style="margin-top:14px">Couldn\u2019t load results. Try refresh.</p></div>';

  function renderAlignment() {
    function block(keys) {
