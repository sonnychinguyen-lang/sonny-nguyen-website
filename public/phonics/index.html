<title>Sound Hive</title>

<style>
  /* Layout: one centred column sized for a tablet or phone held by a child.
     A hive: honey-yellow keys and cells on a pale sky ground, navy ink. One look, light only, by choice. */
  :root {
    --sky: #e6f3ff;
    --card: #ffffff;
    --ink: #1b2545;
    --ink-soft: #55628a;
    --line: #c4d9f0;
    --honey: #ffc83d;
    --honey-deep: #d98a00;
    --honey-pale: #fff3cc;
    --leaf: #1f8f5a;
    --leaf-pale: #d9f3e5;
    --coral: #d8493c;
    --coral-pale: #fde3df;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-read: "Andika", "Comic Sans MS", "Century Gothic", system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font-read); font-size: 17px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 40px; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; }
  h1 { font-size: 2.3rem; font-weight: 800; }
  h2 { font-size: 1.5rem; font-weight: 700; }
  h3 { font-size: 1.15rem; font-weight: 700; }
  p { margin: 0; }
  button { font-family: inherit; color: var(--ink); cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .soft { color: var(--ink-soft); }
  .small { font-size: 0.9rem; }

  .top { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .back { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 0.95rem; }
  .crumb { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--ink-soft); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stars { margin-left: auto; font-family: var(--font-display); font-weight: 700; background: var(--honey-pale); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }

  .hero { display: flex; align-items: center; gap: 16px; }
  .hex { width: 84px; height: 92px; flex: none; background: var(--honey); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.7rem; }
  .hex.big { width: 128px; height: 140px; font-size: 2.6rem; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; width: 100%; font-size: 1rem; }
  .row:hover { border-color: var(--honey-deep); }
  .row .badge { flex: none; width: 54px; height: 54px; border-radius: 14px; background: var(--honey); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; }
  .row .body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .row .go { font-family: var(--font-display); font-weight: 800; font-size: 1.4rem; color: var(--honey-deep); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--font-read); font-weight: 700; background: var(--honey-pale); border-radius: 10px; padding: 2px 10px; font-size: 1rem; }
  .chip.done { background: var(--leaf-pale); }

  .games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .game { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 0.92rem; }
  .game:hover { border-color: var(--honey-deep); }
  .game .ico { font-size: 2rem; line-height: 1; }
  .game b { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.1; }
  .guide { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .guide li { margin: 0; }
  .guide ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .say { border: 0; background: var(--honey-pale); border-radius: 999px; width: 34px; height: 34px; font-size: 1rem; flex: none; }
  .sound-line { display: flex; align-items: center; gap: 10px; }
  .sound-line .chip { font-size: 1.15rem; min-width: 54px; text-align: center; }

  .stage { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .pic { font-size: 4.2rem; line-height: 1; }
  .word { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; font-family: var(--font-read); font-weight: 700; font-size: 2.3rem; }
  .word span { min-width: 1.05em; padding: 2px 4px; border-bottom: 4px solid transparent; }
  .word .gap { border-bottom-color: var(--honey-deep); background: var(--honey-pale); border-radius: 8px 8px 0 0; color: var(--leaf); }
  .sentence { font-size: 1.45rem; line-height: 1.6; max-width: 22em; }
  .sentence .gap { display: inline-block; min-width: 4.2em; border-bottom: 4px solid var(--honey-deep); background: var(--honey-pale); border-radius: 8px 8px 0 0; padding: 0 8px; font-weight: 700; color: var(--leaf); }
  .opts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .opt { font-family: var(--font-read); font-weight: 700; font-size: 1.5rem; min-width: 76px; padding: 10px 18px; border-radius: 16px; border: 0; background: var(--honey); box-shadow: 0 4px 0 var(--honey-deep); }
  .opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--honey-deep); }
  .opt.no { background: var(--coral-pale); box-shadow: 0 4px 0 #f0b5ad; color: var(--coral); }
  .opt.yes { background: var(--leaf-pale); box-shadow: 0 4px 0 #9ed9bb; color: var(--leaf); }
  .opt:disabled { cursor: default; }
  .msg { min-height: 1.6em; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
  .msg.good { color: var(--leaf); } .msg.bad { color: var(--coral); }
  .next { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; border: 0; border-radius: 999px; background: var(--ink); color: #fff; padding: 12px 28px; }
  .dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .dots i.ok { background: var(--leaf); } .dots i.miss { background: var(--honey-deep); } .dots i.now { outline: 3px solid var(--ink); }

  /* bee */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tab { flex: none; font-family: var(--font-read); font-weight: 700; font-size: 1.15rem; border: 2px solid var(--line); background: var(--card); border-radius: 14px; padding: 6px 16px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .bee-head { display: flex; align-items: center; gap: 16px; justify-content: center; }
  .bee-head .info { text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .rank { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .rank-top { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 700; }
  .bar { height: 14px; border-radius: 999px; background: var(--sky); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--honey); border-radius: 999px; transition: width 0.3s; }
  .typed { min-height: 62px; width: 100%; border: 3px dashed var(--line); border-radius: 16px; display: grid; place-items: center; font-family: var(--font-read); font-weight: 700; font-size: 2.1rem; letter-spacing: 0.06em; overflow-wrap: anywhere; padding: 4px 10px; }
  .typed.empty { color: var(--ink-soft); font-size: 1.05rem; font-weight: 400; letter-spacing: 0; }
  .kb { width: 100%; display: flex; flex-direction: column; gap: 6px; user-select: none; }
  .kb-row { display: flex; gap: 5px; justify-content: center; }
  .key { flex: 1 1 0; max-width: 54px; min-width: 0; height: 50px; border: 0; border-radius: 10px; background: var(--sky); box-shadow: 0 3px 0 var(--line); font-family: var(--font-read); font-weight: 700; font-size: 1.3rem; padding: 0; touch-action: manipulation; }
  .key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .key.wide { flex: 1.6 1 0; max-width: 90px; font-size: 1.05rem; }
  .key.sound { flex: 2.4 1 0; max-width: none; background: var(--honey); box-shadow: 0 3px 0 var(--honey-deep); font-size: 1.4rem; }
  .key.enter { flex: 2.4 1 0; max-width: none; background: var(--ink); color: #fff; box-shadow: 0 3px 0 #000; font-family: var(--font-display); font-size: 1.15rem; }
  .found { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .found .chip { background: var(--leaf-pale); }
  .hint { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 0.95rem; }
  .hint-box { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.08em; }
  .foot { text-align: center; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .shake { animation: shake 0.25s 2; }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } .bar i { transition: none; } }
  @media (max-width: 430px) { .games { grid-template-columns: 1fr; } .game { flex-direction: row; text-align: left; padding: 12px 16px; gap: 14px; } .word { font-size: 1.9rem; } .key { height: 46px; font-size: 1.15rem; } h1 { font-size: 1.9rem; } .hex.big { width: 100px; height: 110px; font-size: 2rem; } }
</style>

    draw();
  }

  function labelsFor(L, ids) {
    var out = []; ids.forEach(function (id) { if (out.indexOf(SND[id].g) < 0) out.push(SND[id].g); });
    if (out.length < 3) L.sets.forEach(function (S) { S[1].forEach(function (id) { if (out.length < 3 && out.indexOf(SND[id].g) < 0) out.push(SND[id].g); }); });
    if (out.length < 3) ["a", "e", "i", "o", "u"].forEach(function (v) { if (out.length < 3 && out.indexOf(v) < 0) out.push(v); });
    return out;
  }
  function fillGame(lid, si) {
    var L = findLevel(lid), S = L.sets[si], labels = labelsFor(L, S[1]), items = [];
    S[1].forEach(function (id) { SND[id].p.forEach(function (p) { if (hasSound(p[0], SND[id])) items.push({ word: p[0], pic: p[1], id: id }); }); });
    var seen = {}; items = shuffle(items).filter(function (x) { if (seen[x.word]) return false; seen[x.word] = 1; return true; }).slice(0, 8);
    var back = function () { setScreen(lid, si); };
    round({
      key: lid + "." + si + ".fill", title: "Fill the sound", back: back, again: function () { fillGame(lid, si); },
      prompt: "Which letters finish the word?",
      questions: items.map(function (it) { return { item: it, answer: SND[it.id].g, choices: labels, say: it.word }; }),
      render: function (q, open) {
        var hide = spots(q.item.word, SND[q.item.id]);
        var w = el("div", { class: "word", "aria-label": open ? q.item.word : "word with missing letters" }, q.item.word.split("").map(function (ch, k) { var gap = hide.indexOf(k) >= 0; return el("span", { class: gap ? "gap" : "", text: gap && !open ? " " : ch }); }));
        return { node: el("div", {}, [el("div", { class: "pic", text: q.item.pic }), w]) };
      }
    });
  }
  function sentGame(lid, si) {
    var L = findLevel(lid), S = L.sets[si], all = [];
    S[1].forEach(function (id) { SND[id].s.forEach(function (x) { all.push({ text: x[0], answer: x[1] }); }); });
    var pool = all.map(function (x) { return x.answer; });
    if (pool.length < 3) L.sets.forEach(function (T) { T[1].forEach(function (id) { SND[id].s.forEach(function (x) { if (pool.indexOf(x[1]) < 0) pool.push(x[1]); }); }); });
    var back = function () { setScreen(lid, si); };
    round({
      key: lid + "." + si + ".sent", title: "Finish the sentence", back: back, again: function () { sentGame(lid, si); },
      prompt: "Which word fits the gap?",
      questions: shuffle(all).slice(0, 8).map(function (x) {
        var others = shuffle(pool.filter(function (w) { return w !== x.answer; })).slice(0, 2);
        return { item: x, answer: x.answer, choices: [x.answer].concat(others), say: x.text.replace("___", x.answer) };
      }),
      render: function (q, open) {
        var parts = q.item.text.split("___");
        var p = el("p", { class: "sentence" }, [parts[0], el("span", { class: "gap", text: open ? q.answer : " " }), parts[1] || ""]);
        var listen = sayBtn(q.item.text.replace("___", open ? q.answer : "blank"), "Hear the sentence");
        return { node: el("div", {}, [p, listen ? el("div", { style: "margin-top:10px" }, [listen]) : null]) };
      }
    });
  }

  // ---------- spelling hive ----------
  function bee(lid, si, id) {
    var L = findLevel(lid), S = L.sets[si], s = SND[id], typed = "", goal = beeGoal(id);
    var found = save.bee[id] || (save.bee[id] = []);
    var insert = s.split || s.last || s.re || s.keys ? "" : s.g;
    var typedBox = el("div", { class: "typed empty", "aria-live": "polite" });
    var msg = el("p", { class: "msg", role: "status" });
    var foundBox = el("div", { class: "found" });
    var rankName = el("span"), rankPts = el("span"), barFill = el("i");
    var hintBox = el("p", { class: "hint-box" });
    function paint() {
      typedBox.textContent = typed || "Tap the letters to spell a word with " + s.g;
      typedBox.className = "typed" + (typed ? "" : " empty");
      var p = beePoints(id), frac = Math.min(1, p / goal), name = RANKS[0][1], nextAt = null;
      RANKS.forEach(function (r) { if (frac >= r[0]) name = r[1]; else if (nextAt === null) nextAt = Math.ceil(r[0] * goal); });
      rankName.textContent = name; rankPts.textContent = p + " ⭐" + (nextAt ? " · next rank at " + nextAt : "");
      barFill.style.width = Math.round(frac * 100) + "%";
      var st = document.getElementById("stars"); if (st) st.textContent = "⭐ " + totalStars();
      foundBox.textContent = "";
      found.slice().reverse().forEach(function (w) { foundBox.appendChild(el("span", { class: "chip", text: w })); });
    }
    function say(text, cls) { msg.textContent = text; msg.className = "msg " + (cls || ""); }
    function press(ch) { if (typed.length < 14) { typed += ch; say(""); paint(); } }
    function del() { typed = typed.slice(0, -1); paint(); }
    function enter() {
      var w = typed.toLowerCase();
      if (!w) return;
      if (w.length < 3) { say("Too short. Use 3 letters or more.", "bad"); typed = ""; paint(); return; }
      if (found.indexOf(w) >= 0) { say("You already found " + w + ".", "bad"); typed = ""; paint(); return; }
      if (DICT[id][w]) {
        found.push(w); persist(); typed = ""; hintBox.textContent = "";
        say(w + "! +" + pts(w) + " ⭐", "good"); speak(w); paint(); return;
      }
      if (TRICK[id][w]) { say("Real word, but " + s.g + " makes a different sound in " + w + ".", "bad"); }
      else if (!hasSound(w, s)) { say("Your word needs " + s.g + ".", "bad"); }
      else { say("I don't know " + w + " yet. Try another word.", "bad"); }
      typed = ""; paint();
      typedBox.classList.remove("shake"); void typedBox.offsetWidth; typedBox.classList.add("shake");
    }
    function hint() {
      var left = s.p.filter(function (p) { return found.indexOf(p[0]) < 0; });
      if (!left.length) { hintBox.textContent = "You found all my picture words. Think of your own!"; return; }
      var p = left[Math.floor(Math.random() * left.length)], show = spots(p[0], s);
      hintBox.textContent = p[1] + "  " + p[0].split("").map(function (ch, k) { return show.indexOf(k) >= 0 ? ch : "_"; }).join(" ");
    }
    function keyBtn(ch) { return el("button", { class: "key", type: "button", text: ch, onclick: function () { press(ch); } }); }
    var rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm"].map(function (r, k) {
      var kids = r.split("").map(keyBtn);
      if (k === 2) kids.push(el("button", { class: "key wide", type: "button", "aria-label": "Delete", onclick: del }, ["⌫"]));
      return el("div", { class: "kb-row" }, kids);
    });
    var bottom = el("div", { class: "kb-row" }, [
      insert ? el("button", { class: "key sound", type: "button", "aria-label": "Type " + s.g, onclick: function () { press(insert); } }, [s.g]) : null,
      el("button", { class: "key enter", type: "button", onclick: enter }, ["Enter ✓"])
    ]);
    document.onkeydown = function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^[a-zA-Z]$/.test(e.key)) { press(e.key.toLowerCase()); e.preventDefault(); }
      else if (e.key === "Backspace") { del(); e.preventDefault(); }
      else if (e.key === "Enter") { var a = document.activeElement; if (!a || a.tagName !== "BUTTON" || a.classList.contains("key")) { enter(); e.preventDefault(); } }
    };
    show([
      top(function () { setScreen(lid, si); }, "Spelling hive"),
      S[1].length > 1 ? el("div", { class: "tabs", role: "group", "aria-label": "Sound" }, S[1].map(function (x) { return el("button", { class: "tab", type: "button", "aria-pressed": String(x === id), text: SND[x].g + (S[1].filter(function (y) { return SND[y].g === SND[x].g; }).length > 1 ? " (" + SND[x].p[0][0] + ")" : ""), title: SND[x].hint, onclick: function () { bee(lid, si, x); } }); })) : null,
      el("div", { class: "stage" }, [
        el("div", { class: "bee-head" }, [el("div", { class: "hex big", text: s.g }), el("div", { class: "info" }, [el("h3", { text: "Spell words with " + s.g }), el("span", { class: "soft", text: s.hint }), el("span", { class: "soft small", text: "3 letters = 1 ⭐ · 4 letters = 2 ⭐ · 5 letters = 3 ⭐" })])]),
        el("div", { class: "rank" }, [el("div", { class: "rank-top" }, [rankName, rankPts]), el("div", { class: "bar" }, [barFill])]),
        typedBox, msg,
        el("div", { class: "kb" }, rows.concat([bottom])),
        el("div", { class: "opts" }, [el("button", { class: "hint", type: "button", onclick: hint }, ["💡 Give me a hint"])]),
        hintBox,
        el("h3", { text: "Words you found" }), foundBox
      ])
    ]);
    paint();
  }

  home();
})();
</script>
